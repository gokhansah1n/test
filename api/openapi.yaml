openapi: 3.1.0
info:
  title: TFL Probe API
  version: "1.0.0"
  description: Probe API used as sample content for the connected-repository features.
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      description: Returns the pets.
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /pets/{petId}:
    delete:
      operationId: deletePet
      summary: Delete a pet
      description: Removes a pet permanently.
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: deleted }
